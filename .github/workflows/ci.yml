name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Everything scripts/install-toolchain.sh puts under the home
      # directory.  The key changes with the script and with the crate
      # manifests, which is also when the script installs again.
      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/alr
            ~/.local/bin/renode
            ~/.local/share/alire
            ~/.local/share/renode
            ~/.alire
            ~/.config/alire
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-toolchain.sh', '**/alire.toml') }}

      - name: Install toolchain
        run: scripts/install-toolchain.sh

      - name: Format
        run: scripts/check.sh format

      - name: Build
        run: scripts/check.sh build

      - name: Test
        run: scripts/check.sh test

      - name: Fuzz
        run: scripts/check.sh fuzz

      # The answers of the provers.  A cache cannot be changed once it is
      # saved, so every run saves one of its own and starts from the most
      # recent one made with the same toolchain.
      - name: Cache proof results
        uses: actions/cache@v6
        with:
          path: ~/.cache/gnatprove
          key: gnatprove-${{ runner.os }}-${{ hashFiles('scripts/install-toolchain.sh') }}-${{ github.sha }}
          restore-keys: |
            gnatprove-${{ runner.os }}-${{ hashFiles('scripts/install-toolchain.sh') }}-

      - name: Prove
        run: GNATPROVE_CACHE="$HOME/.cache/gnatprove" scripts/check.sh prove

      - name: Test on simulated STM32F4
        run: scripts/check.sh target

      - name: Benchmarks
        run: scripts/check.sh bench

      - name: Documentation
        run: scripts/check.sh doc

  # The parsers under examples/ are what the compiler backend in compiler/
  # generates.  The job builds the Kaitai Struct compiler with that backend
  # and compares.
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/alr
            ~/.local/bin/renode
            ~/.local/share/alire
            ~/.local/share/renode
            ~/.alire
            ~/.config/alire
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-toolchain.sh', '**/alire.toml') }}

      - name: Install toolchain
        run: scripts/install-toolchain.sh

      # The checkout of the upstream compiler with its build, and what sbt
      # has downloaded.  A build from nothing takes several minutes.
      - name: Cache compiler
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/kaitai_struct_compiler
            ~/.cache/coursier
            ~/.ivy2
            ~/.sbt
          key: compiler-${{ runner.os }}-${{ hashFiles('compiler/shared/**', 'compiler/upstream.patch', 'scripts/build-compiler.sh') }}
          restore-keys: |
            compiler-${{ runner.os }}-

      - name: Build the compiler
        run: scripts/build-compiler.sh

      - name: Examples are what the compiler generates
        run: scripts/generate-examples.sh --check
